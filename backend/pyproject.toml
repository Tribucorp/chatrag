[project]
name = "chatrag-api"
version = "0.1.0"
description = "Backend RAG de ChatRAG — piloto de adopcion del Tribu SDK. Consume los modulos tribu-* como wheels del registry privado; nada de vendorizar ni copiar codigo del SDK."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # --- Tribu SDK (wheels Nuitka del registry privado de Tribucorp, NO PyPI) ---
    # Se instalan con el indice privado configurado (ver [tool.uv] abajo). Pin estricto,
    # nunca 'latest' (regla del SDK). tribu-voice va tras flag apagado (bloqueo legal NVIDIA).
    "tribu-http>=0.1,<0.2",
    "tribu-observability>=0.1,<0.2",
    "tribu-auth>=0.1,<0.2",
    "tribu-rag>=0.1,<0.2",
    "tribu-voice>=0.1,<0.2",
    "tribu-demo-kit>=0.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# El SDK NO esta en PyPI: se sirve como wheels del registry privado de Tribucorp. La URL real
# se inyecta por entorno en CI/registry (UV_INDEX_TRIBU_URL); aqui solo se declara el nombre
# del indice y que los tribu-* salen de el, para que ningun tribu-* se resuelva contra PyPI.
[[tool.uv.index]]
name = "tribu"
url = "https://registry.tribucorp.internal/simple"
explicit = true

[tool.uv.sources]
tribu-http = { index = "tribu" }
tribu-observability = { index = "tribu" }
tribu-auth = { index = "tribu" }
tribu-rag = { index = "tribu" }
tribu-voice = { index = "tribu" }
tribu-demo-kit = { index = "tribu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatrag_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` en defaults es el patrón idiomático y documentado de FastAPI.
ignore = ["B008"]
