[project]
name = "chatrag-api"
version = "0.1.0"
description = "Backend RAG de ChatRAG — piloto de adopcion del Tribu SDK. Consume los modulos tribu-* como dependencias git fijadas a un tag del SDK (ADR-0020); nada de vendorizar ni copiar codigo del SDK."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # --- Tribu SDK: dependencias git fijadas a un tag (ADR-0020 del SDK, docs/CONSUMIR_EL_SDK.md) ---
    # No hay indice PyPI propio: `registry.tribucorp.internal` nunca existio. La version la fija
    # la `tag` de [tool.uv.sources] (todas la misma), no el rango de aqui. tribu-crypto entra
    # como dependencia transitiva de tribu-guardrails y se fija igual para que todo el SDK sea
    # de la misma release. tribu-audit y tribu-crypto tienen nucleo Rust: instalar exige cargo.
    "tribu-http",
    "tribu-rag",
    "tribu-audit",
    "tribu-crypto",
    "tribu-guardrails",
    "tribu-voice",
    # --- PyPI normal, no del registry privado ---
    # Respalda tribu_audit.AuditChain en Postgres (ver audit.py) -- opt-in, solo se usa si
    # CHATRAG_AUDIT_DATABASE_URL/CHATRAG_AUDIT_CHAIN_KEY estan configuradas.
    "asyncpg>=0.29",
    # Cliente del vector store real de tribu-rag (tribu_rag.milvus_store.MilvusVectorStore
    # envuelve pymilvus, pero pymilvus mismo sigue siendo una dependencia directa del backend
    # que lo usa -- no es opcional, es la ruta real de /query y de la ingesta en produccion,
    # ver rag.py::tribu_rag_retriever e ingest.py::TribuRagIngestor).
    "pymilvus>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# El SDK es privado de la organizacion: en local basta `gh auth setup-git`; en CI, un PAT de solo
# lectura sobre Tribucorp/tribu-sdk (secret TRIBU_SDK_PAT, ver .github/workflows/ci.yml).
# Al subir de release del SDK se cambia la `tag` en TODAS las lineas a la vez.
[tool.uv.sources]
tribu-http = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-http" }
tribu-rag = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-rag" }
tribu-audit = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-audit" }
tribu-crypto = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-crypto" }
tribu-guardrails = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-guardrails" }
tribu-voice = { git = "https://github.com/Tribucorp/tribu-sdk", tag = "v1.0.0", subdirectory = "python/tribu-voice" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatrag_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requiere el SDK instalado de verdad (dependencias git, ADR-0020) (ver .github/workflows/ci.yml, job backend-integration); no corre en el job unitario.",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` en defaults es el patrón idiomático y documentado de FastAPI.
ignore = ["B008"]
