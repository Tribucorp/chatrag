[project]
name = "chatrag-api"
version = "0.1.0"
description = "Backend RAG de ChatRAG — piloto de adopcion del Tribu SDK. Consume los modulos tribu-* como wheels del registry privado; nada de vendorizar ni copiar codigo del SDK."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # --- Tribu SDK (wheels Nuitka del registry privado de Tribucorp, NO PyPI) ---
    # Se instalan con el indice privado configurado (ver [tool.uv] abajo). Pin estricto,
    # nunca 'latest' (regla del SDK). Solo se declaran los modulos que el SDK publica hoy
    # (fase S0 del SDK, ver tribu_maestro_estado_sdk): tribu-observability, tribu-auth
    # y tribu-demo-kit NO existen todavia en el registry, asi que fijarlos aqui rompe
    # `uv sync` de verdad (CI lo esquiva con --no-deps, lo que ocultaba el problema).
    # Volver a añadir cada uno cuando el SDK lo publique (confirmar con el equipo del SDK,
    # no solo con este comentario).
    "tribu-http>=0.1,<0.2",
    "tribu-rag>=0.1,<0.2",
    # tribu-audit, tribu-guardrails y tribu-voice SI existen hoy (fase S0) -- API confirmada
    # leyendo el codigo fuente real del SDK en disco (~/repositorio/tribu-sdk/python/), no el
    # corpus de x9 (se rehuso por falta de referencia documentada). Ver audit.py,
    # rag.py::_TribuNimChatGenerator.generate, y voice.py.
    "tribu-audit>=0.1,<0.2",
    "tribu-guardrails>=0.1,<0.2",
    "tribu-voice>=0.1,<0.2",
    # --- PyPI normal, no del registry privado ---
    # Respalda tribu_audit.AuditChain en Postgres (ver audit.py) -- opt-in, solo se usa si
    # CHATRAG_AUDIT_DATABASE_URL/CHATRAG_AUDIT_CHAIN_KEY estan configuradas.
    "asyncpg>=0.29",
    # Cliente del vector store real de tribu-rag (tribu_rag.milvus_store.MilvusVectorStore
    # envuelve pymilvus, pero pymilvus mismo sigue siendo una dependencia directa del backend
    # que lo usa -- no es opcional, es la ruta real de /query y de la ingesta en produccion,
    # ver rag.py::tribu_rag_retriever e ingest.py::TribuRagIngestor).
    "pymilvus>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

# El SDK NO esta en PyPI: se sirve como wheels del registry privado de Tribucorp. La URL real
# se inyecta por entorno en CI/registry (UV_INDEX_TRIBU_URL); aqui solo se declara el nombre
# del indice y que los tribu-* salen de el, para que ningun tribu-* se resuelva contra PyPI.
[[tool.uv.index]]
name = "tribu"
url = "https://registry.tribucorp.internal/simple"
explicit = true

[tool.uv.sources]
tribu-http = { index = "tribu" }
tribu-rag = { index = "tribu" }
tribu-audit = { index = "tribu" }
tribu-guardrails = { index = "tribu" }
tribu-voice = { index = "tribu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatrag_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requiere el registry privado del SDK instalado de verdad (ver .github/workflows/ci.yml, job backend-integration); no corre en el job unitario.",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: `Depends(...)` en defaults es el patrón idiomático y documentado de FastAPI.
ignore = ["B008"]
