# Fase D — despliegue on-prem de ChatRAG en una DGX Spark, offline (sin APIs cloud). Adapta
# DIRECTAMENTE el patrón real y ya probado en producción de
# ~/repositorio/tribu-sdk/deploy/docker-compose.maestro.yml (sirve a x9 en spark-69f8 hoy) — no
# se reinventa nada de lo que ese fichero ya resolvió en real (permisos de caché de los NIM,
# orden de arranque para evitar CUDA OOM, guardas de bind solo-loopback). Diferencias
# deliberadas frente al maestro:
#   - 3 NIM (chat/embed/rerank), no 4: ChatRAG no necesita un segundo modelo "juez"
#     (nim-lightning es específico del patrón de verificación de x9, B-... issue #91/#96).
#   - Voz con Riva (Speech NIM): Magpie TTS 1.10.0 (la misma imagen que X9Voz tiene en
#     producción en spark-69f8) y Parakeet 1.1b RNNT Multilingual para ASR (fijado por digest:
#     el repo solo publica `latest`). Contrato HTTP en backend/src/chatrag_api/voice.py.
#   - chatrag-api y el frontend Next.js SÍ corren aquí como contenedores propios (el maestro no
#     empaqueta ningún consumidor, solo sus dependencias — tribu-mcp-server lo invoca por SSH).
#
# Uso:
#   cp deploy/.env.chatrag-spark.example deploy/.env.chatrag-spark   # rellenar con valores reales
#   docker compose --env-file deploy/.env.chatrag-spark -f deploy/docker-compose.chatrag-spark.yml up -d
#
# Requiere deploy/wheels/*.whl ya construidos (ver deploy/despliegue_spark.sh fase 2) antes del
# primer build de chatrag-api — el registry privado del SDK no es alcanzable desde este Spark
# hoy (ver docstring de deploy/Dockerfile.backend).

include:
  - path: ../../tribu-sdk/python/tribu-rag/deploy/docker-compose.milvus.yml

services:
  # Mismo hallazgo real que el maestro (17-ago-2026): un volumen con nombre nuevo lo crea
  # Docker root:root, y el NIM (que corre como UID 1000 "nvs" dentro del contenedor) crashea
  # al intentar escribir su caché de modelo ahí. Se corrige el propietario una sola vez, antes
  # de que los NIM arranquen.
  fix-nim-cache-perms:
    image: busybox:1.36
    command: ["sh", "-c", "chown -R 1000:1000 /chat-cache /embed-cache /rerank-cache /tts-cache /asr-cache"]
    volumes:
      - nim-chat-cache:/chat-cache
      - nim-embed-cache:/embed-cache
      - nim-rerank-cache:/rerank-cache
      - nim-tts-cache:/tts-cache
      - nim-asr-cache:/asr-cache
    restart: "no"

  nim-chat:
    image: ${NIM_CHAT_IMAGE:?falta NIM_CHAT_IMAGE — ver deploy/.env.chatrag-spark.example}
    restart: unless-stopped
    depends_on:
      fix-nim-cache-perms:
        condition: service_completed_successfully
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?falta NGC_API_KEY — ver deploy/.env.chatrag-spark.example}
      NIM_TELEMETRY_MODE: "0"
      # Mismos valores medidos en real contra este modelo en el maestro (ver su docstring,
      # 27-ago-2026) — arranca primero a propósito (issue #111 del maestro: NIM_GPU_MEM_FRACTION
      # se aplica sobre la memoria LIBRE en el momento del arranque de CADA NIM, no sobre el
      # total; el primero en arrancar es el único con la fracción garantizada completa).
      NIM_GPU_MEM_FRACTION: "0.40"
      NIM_MAX_MODEL_LEN: "32768"
    volumes:
      - nim-chat-cache:/opt/nim/.cache
    ports:
      # Solo loopback por defecto — para alcance real desde otra máquina de la tailnet, fija
      # esto a la IP Tailscale real del Spark (`tailscale ip -4`, ejecutado EN el Spark). Nunca
      # "0.0.0.0": eso expondría el NIM en cualquier interfaz, no solo la tailnet.
      - "${NIM_CHAT_BIND_HOST:-127.0.0.1}:8004:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      start_period: 300s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nim-embed:
    image: ${NIM_EMBED_IMAGE:?falta NIM_EMBED_IMAGE — ver deploy/.env.chatrag-spark.example}
    restart: unless-stopped
    depends_on:
      fix-nim-cache-perms:
        condition: service_completed_successfully
      nim-chat:
        condition: service_healthy
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?falta NGC_API_KEY — ver deploy/.env.chatrag-spark.example}
      NIM_TELEMETRY_MODE: "0"
    volumes:
      - nim-embed-cache:/opt/nim/.cache
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nim-rerank:
    image: ${NIM_RERANK_IMAGE:?falta NIM_RERANK_IMAGE — ver deploy/.env.chatrag-spark.example}
    restart: unless-stopped
    depends_on:
      fix-nim-cache-perms:
        condition: service_completed_successfully
      nim-chat:
        condition: service_healthy
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?falta NGC_API_KEY — ver deploy/.env.chatrag-spark.example}
      NIM_TELEMETRY_MODE: "0"
    volumes:
      - nim-rerank-cache:/opt/nim/.cache
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      start_period: 180s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Riva TTS — Magpie Multilingual (solo voces stock es-US). Mismos parámetros que el servicio
  # `tts` de X9Voz en producción (deploy/docker-compose.x9voz.yml): HTTP 9000, shm 8 GB, selector
  # por nombre. Arranca tras nim-chat (orden de arranque: issue #111 del maestro).
  nim-tts:
    image: ${NIM_TTS_IMAGE:-nvcr.io/nim/nvidia/magpie-tts-multilingual:1.10.0}
    restart: unless-stopped
    shm_size: 8gb
    depends_on:
      fix-nim-cache-perms:
        condition: service_completed_successfully
      nim-chat:
        condition: service_healthy
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?falta NGC_API_KEY — ver deploy/.env.chatrag-spark.example}
      NIM_TELEMETRY_MODE: "0"
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50051"
      NIM_TAGS_SELECTOR: name=magpie-tts-multilingual
    volumes:
      - nim-tts-cache:/opt/nim/.cache
    ports:
      - "127.0.0.1:9320:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      start_period: 30m # la primera vez descarga y optimiza el modelo
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Riva ASR — Parakeet 1.1b RNNT Multilingual (es-ES/es-US). Solo transcribe texto: nunca se
  # infiere la emoción del usuario (regla dura de tribu-voice). Modo offline sin diarización
  # (~25,6 GB de GPU según la matriz de soporte; `mode=all` pide ~50 GB). Fijado por digest.
  nim-asr:
    image: ${NIM_ASR_IMAGE:-nvcr.io/nim/nvidia/parakeet-1-1b-rnnt-multilingual@sha256:670db8fb668142017a12ef6fef1834e37119c3cd03180b87e5c26deb830d87d3}
    restart: unless-stopped
    shm_size: 8gb
    depends_on:
      fix-nim-cache-perms:
        condition: service_completed_successfully
      nim-tts:
        condition: service_healthy
    environment:
      NGC_API_KEY: ${NGC_API_KEY:?falta NGC_API_KEY — ver deploy/.env.chatrag-spark.example}
      NIM_TELEMETRY_MODE: "0"
      NIM_HTTP_API_PORT: "9000"
      NIM_GRPC_API_PORT: "50051"
      NIM_TAGS_SELECTOR: ${NIM_ASR_TAGS_SELECTOR:-mode=ofl,diarizer=disabled}
    volumes:
      - nim-asr-cache:/opt/nim/.cache
    ports:
      - "127.0.0.1:9310:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/v1/health/ready"]
      interval: 30s
      start_period: 30m
      timeout: 10s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Seed inicial de knowledge/*.md (baked en la imagen de chatrag-api en /seed-knowledge, ver
  # deploy/Dockerfile.backend) dentro del volumen con nombre — mismo patrón init-container que
  # fix-nim-cache-perms arriba, evita una ruta de host en `volumes:`. Solo copia si el volumen
  # está vacío (no pisa documentos subidos después vía POST /admin/sources).
  seed-knowledge:
    image: ${CHATRAG_API_IMAGE:-chatrag-api:latest}
    command: ["sh", "-c", "[ -n \"$$(ls -A /knowledge 2>/dev/null)\" ] || cp -r /seed-knowledge/. /knowledge/"]
    volumes:
      - chatrag-knowledge:/knowledge
    restart: "no"

  chatrag-api:
    image: ${CHATRAG_API_IMAGE:-chatrag-api:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      seed-knowledge:
        condition: service_completed_successfully
      nim-chat:
        condition: service_healthy
      nim-embed:
        condition: service_healthy
      nim-rerank:
        condition: service_healthy
      nim-tts:
        condition: service_healthy
      nim-asr:
        condition: service_healthy
    environment:
      CHATRAG_APP_NAME: ${CHATRAG_APP_NAME:-ChatRAG}
      CHATRAG_EMBED_DIM: "2048"
      CHATRAG_TENANT_ID: ${CHATRAG_TENANT_ID:-ventisca-ti}
      # Nombres de servicio del propio compose (red interna) — no localhost, no el puerto
      # publicado en el host (ese solo sirve para curl manual desde el Spark, ver ports: arriba).
      CHATRAG_MILVUS_URI: http://milvus-standalone:19530
      CHATRAG_NIM_EMBED_URL: http://nim-embed:8000
      CHATRAG_NIM_RERANK_URL: http://nim-rerank:8000
      CHATRAG_NIM_CHAT_URL: http://nim-chat:8000
      CHATRAG_NIM_TTS_URL: http://nim-tts:9000
      CHATRAG_NIM_ASR_URL: http://nim-asr:9000
      CHATRAG_NIM_EMBED_MODEL_ID: ${CHATRAG_NIM_EMBED_MODEL_ID:-nvidia/llama-nemotron-embed-1b-v2}
      CHATRAG_NIM_RERANK_MODEL_ID: ${CHATRAG_NIM_RERANK_MODEL_ID:-nvidia/llama-nemotron-rerank-vl-1b-v2}
      # El model_id real lo reporta el propio NIM en /v1/models tras el primer arranque (mismo
      # criterio que ingesta_corpus.py del SDK para el embed) — deploy/despliegue_spark.sh lo
      # consulta y lo pasa aquí; el default es una suposición razonable, no verificada.
      CHATRAG_NIM_CHAT_MODEL: ${CHATRAG_NIM_CHAT_MODEL:-nemotron}
      CHATRAG_EGRESS_HOSTS: "nim-embed,nim-rerank,nim-chat,nim-tts,nim-asr"
      CHATRAG_VOICE_ENABLED: ${CHATRAG_VOICE_ENABLED:-0}
      CHATRAG_SERVICE_BEARER_TOKEN: ${CHATRAG_SERVICE_BEARER_TOKEN:?falta CHATRAG_SERVICE_BEARER_TOKEN}
      CHATRAG_ADMIN_TOKEN: ${CHATRAG_ADMIN_TOKEN:?falta CHATRAG_ADMIN_TOKEN}
      CHATRAG_KNOWLEDGE_DIR: /knowledge
      CHATRAG_THEME_FILE: /data/theme.json
      # Sin tribu-auth ni proveedor SSO real todavía (ver CLAUDE.md) — sin esto, /query
      # responde 401 a cualquier visitante real. "nunca en producción" según su propio
      # docstring: se deja SIN configurar por defecto a propósito, decide explícitamente por
      # entorno en deploy/.env.chatrag-spark si este despliegue es para probar en dev.
      CHATRAG_DEV_IDENTITY_BYPASS: ${CHATRAG_DEV_IDENTITY_BYPASS:-}
    volumes:
      - chatrag-knowledge:/knowledge
      - chatrag-data:/data
    ports:
      - "${CHATRAG_API_BIND_HOST:-127.0.0.1}:8091:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      start_period: 20s
      timeout: 10s
      retries: 5

  frontend:
    image: ${CHATRAG_FRONTEND_IMAGE:-chatrag-frontend:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      # NEXT_PUBLIC_* se incrusta en el bundle al compilar: la voz del navegador se decide aquí.
      args:
        NEXT_PUBLIC_VOICE_ENABLED: ${CHATRAG_VOICE_ENABLED:-0}
      # @tribu/auth desde GitHub Packages: token read:packages SOLO en el build (secreto de
      # BuildKit, no queda en la imagen). `export NODE_AUTH_TOKEN=...` antes de `compose build`.
      secrets:
        - node_auth_token
    restart: unless-stopped
    depends_on:
      chatrag-api:
        condition: service_healthy
    environment:
      CHATRAG_API_URL: http://chatrag-api:8080
      CHATRAG_SERVICE_BEARER_TOKEN: ${CHATRAG_SERVICE_BEARER_TOKEN:?falta CHATRAG_SERVICE_BEARER_TOKEN}
      CHATRAG_AUTH_SECRET: ${CHATRAG_AUTH_SECRET:?falta CHATRAG_AUTH_SECRET}
      CHATRAG_AUTH_URL: ${CHATRAG_AUTH_URL:?falta CHATRAG_AUTH_URL}
      # Cuentas demo con contraseña pública (src/lib/seed-demo.ts): solo para la demo, opt-in.
      CHATRAG_AUTH_DEMO_SEED: ${CHATRAG_AUTH_DEMO_SEED:-0}
      NEXT_PUBLIC_APP_NAME: ${CHATRAG_APP_NAME:-ChatRAG}
    ports:
      # Mismo criterio que los NIM: solo loopback salvo que se fije explícitamente a la IP
      # Tailscale del Spark para que el equipo de prueba llegue al chat real desde fuera.
      - "${CHATRAG_FRONTEND_BIND_HOST:-127.0.0.1}:3000:3000"

volumes:
  nim-chat-cache:
  nim-embed-cache:
  nim-rerank-cache:
  nim-tts-cache:
  nim-asr-cache:
  chatrag-knowledge:
  chatrag-data:

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
