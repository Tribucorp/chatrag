name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12
      - run: uv pip install fastapi uvicorn pydantic httpx pytest mypy ruff
      - run: uv pip install --no-deps -e .
      - run: uv run ruff check src tests
      - run: uv run mypy --strict src/chatrag_api
      - run: uv run pytest tests -q
